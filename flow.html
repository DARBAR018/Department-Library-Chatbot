<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department Library - QR Books</title>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}

header{
    background:#182848;
    color:white;
    text-align:center;
    padding:25px 10px;
}

header h1{
    margin:0 0 8px;
}

.controls{
    background:white;
    padding:18px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px #ccc;
}

input,select{
    width:280px;
    max-width:90%;
    padding:12px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:7px;
}

#bookCount{
    font-weight:bold;
    margin-top:10px;
}

.book-container{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.book{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.book h3{
    color:#182848;
    min-height:45px;
}

.book p{
    margin:7px 0;
}

.qr{
    width:160px;
    min-height:160px;
    margin:15px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.btn{
    display:inline-block;
    padding:10px 15px;
    margin:5px 2px;
    border-radius:6px;
    color:white;
    text-decoration:none;
    border:none;
    cursor:pointer;
    background:#182848;
}

.btn:hover{
    opacity:.85;
}

.read{
    background:#198754;
}

.print{
    background:#6c757d;
}

.scan-info{
    background:#fff3cd;
    padding:15px;
    margin:20px;
    border-radius:8px;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <h1>📚 Department Library</h1>
    <p>200 Engineering Books • QR Code Library</p>
</header>

<div class="scan-info">
    📱 <b>QR Scan:</b> કોઈપણ bookનું QR scan કરો અને તે bookની information જુઓ.
</div>

<div class="controls">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search Book / Author"
        onkeyup="showBooks()"
    >

    <select id="branch" onchange="showBooks()">
        <option value="All">All Branches</option>
        <option value="Computer">Computer Engineering</option>
        <option value="Civil">Civil Engineering</option>
        <option value="Mechanical">Mechanical Engineering</option>
        <option value="Electrical">Electrical Engineering</option>
    </select>

    <div id="bookCount"></div>

</div>

<div class="book-container" id="bookContainer"></div>


<script>

/* ==========================================
   CREATE BOOK DATABASE
========================================== */

function addBooks(list,branch){

    list.forEach((title,index)=>{

        let id=books.length+1;

        books.push({

            id:id,

            title:title,

            author:"Engineering Author",

            branch:branch,

            /*
            Authorized PDF મૂકવાની જગ્યા.
            Example:
            books/computer/1.pdf
            */

            pdf:
            "books/"+
            branch.toLowerCase()+
            "/"+
            (index+1)+
            ".pdf"

        });

    });

}

addBooks(computerBooks,"Computer");
addBooks(civilBooks,"Civil");
addBooks(mechanicalBooks,"Mechanical");
addBooks(electricalBooks,"Electrical");


/* ==========================================
   QR CODE URL
========================================== */

function getQRURL(book){

    /*
    QR scan થયા પછી આ URL open થશે.
    */

    return window.location.origin +
           window.location.pathname +
           "?book=" +
           book.id;

}


/* ==========================================
   DISPLAY BOOKS
========================================== */

function showBooks(){

    const container=
        document.getElementById("bookContainer");

    const search=
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const branch=
        document
        .getElementById("branch")
        .value;

    container.innerHTML="";

    const filtered=
        books.filter(book=>{

            const searchMatch=
                book.title
                .toLowerCase()
                .includes(search)
                ||
                book.author
                .toLowerCase()
                .includes(search);

            const branchMatch=
                branch==="All"
                ||
                book.branch===branch;

            return searchMatch && branchMatch;

        });

    document.getElementById("bookCount").innerText=
        "Showing "+filtered.length+" of 200 Books";


    filtered.forEach(book=>{

        const card=
        document.createElement("div");

        card.className="book";

        card.innerHTML=`

            <h3>📖 ${book.title}</h3>

            <p>
                <b>Book ID:</b>
                ${book.id}
            </p>

            <p>
                <b>Branch:</b>
                ${book.branch} Engineering
            </p>

            <p>
                <b>Author:</b>
                ${book.author}
            </p>

            <div
                class="qr"
                id="qr-${book.id}">
            </div>

            <a
                class="btn read"
                href="${book.pdf}"
                target="_blank">
                📚 Read Book
            </a>

            <button
                class="btn print"
                onclick="printQR(${book.id})">
                🖨️ Print QR
            </button>

        `;

        container.appendChild(card);


        /* Generate QR */

        new QRCode(
            document.getElementById(
                "qr-"+book.id
            ),
            {
                text:getQRURL(book),
                width:150,
                height:150
            }
        );

    });

}


/* ==========================================
   PRINT QR
========================================== */

function printQR(id){

    const book=
        books.find(b=>b.id===id);

    const qr=
        document.getElementById(
            "qr-"+id
        ).innerHTML;

    const win=
        window.open("","_blank");

    win.document.write(`

        <html>

        <head>
        <title>Book QR - ${book.title}</title>
        </head>

        <body
        style="text-align:center;font-family:Arial">

        <h2>${book.title}</h2>

        <p>
        ${book.branch} Engineering
        </p>

        ${qr}

        <p>
        Book ID: ${book.id}
        </p>

        <p>
        Scan this QR Code to view the book.
        </p>

        </body>

        </html>

    `);

    win.document.close();

    win.print();

}


/* ==========================================
   QR SCAN → OPEN BOOK
========================================== */

function openScannedBook(){

    const params=
        new URLSearchParams(
            window.location.search
        );

    const id=
        parseInt(
            params.get("book")
        );

    if(!id) return;

    const book=
        books.find(
            b=>b.id===id
        );

    if(!book) return;


    document.body.innerHTML=`

        <header>

            <h1>📚 Department Library</h1>

            <p>Book Details</p>

        </header>


        <div
        style="
        max-width:600px;
        margin:30px auto;
        padding:25px;
        background:white;
        border-radius:12px;
        box-shadow:0 3px 15px #ccc;
        text-align:center;
        ">

            <h2>
            📖 ${book.title}
            </h2>

            <p>
            <b>Book ID:</b>
            ${book.id}
            </p>

            <p>
            <b>Branch:</b>
            ${book.branch} Engineering
            </p>

            <p>
            <b>Author:</b>
            ${book.author}
            </p>

            <br>

            <a
            href="${book.pdf}"
            target="_blank"
            style="
            display:inline-block;
            padding:14px 25px;
            background:#198754;
            color:white;
            text-decoration:none;
            border-radius:7px;
            font-weight:bold;
            ">

            📚 READ BOOK

            </a>

            <br><br>

            <a
            href="books.html"
            style="
            display:inline-block;
            padding:10px 20px;
            background:#182848;
            color:white;
            text-decoration:none;
            border-radius:7px;
            ">

            ← Back to Library

            </a>

        </div>

    `;

}


/* ==========================================

========================================== */

if(
    new URLSearchParams(
        window.location.search
    ).has("book")

    openScannedBook();

}else{

    showBooks();
