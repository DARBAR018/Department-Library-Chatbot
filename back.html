body{

.search{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.buttons button{
    border:0;
    padding:10px 16px;
    background:#2563eb;
    color:white;
    border-radius:7px;
    cursor:pointer;
}

.buttons button:hover{

}

.count{
    background:white;
    padding:12px;
    margin-bottom:20px;
    border-radius:8px;
    font-weight:bold;
}

.book-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.book{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.book h3{

    margin-bottom:12px;
    min-height:45px;
}

.book p{

    color:#475569;
}

.qr{
    width:130px;
    height:130px;
    margin:15px auto;
}

.open-btn{
    display:inline-block;
    text-decoration:none;
    background:#16a34a;
    color:white;
    padding:10px 18px;
    border-radius:7px;
}

.open-btn:hover{
    background:#15803d;

.not-found{
    background:white;
    padding:30px;
    text-align:center;
    color:red;
    border-radius:10px;
}
</style>

/* =====================================
   VARIABLES
===================================== */

let selectedDepartment = "All";


/* =====================================
   DISPLAY BOOKS
===================================== */

function displayBooks(){

    const grid =
        document.getElementById("bookGrid");

    const count =
        document.getElementById("count");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    grid.innerHTML = "";

    const result = books.filter(book=>{

        const departmentOK =
            selectedDepartment === "All" ||
            book.department === selectedDepartment;

        const searchOK =
            book.name.toLowerCase()
            .includes(search) ||

            book.id.toLowerCase()
            .includes(search);

        return departmentOK && searchOK;

    });


    count.innerHTML =
        "📚 Showing " +
        result.length +
        " / 200 Books";


    if(result.length === 0){

        grid.innerHTML = `
        <div class="not-found">
            <h2>❌ Book Not Found</h2>
            <p>Please try another book name.</p>
        </div>
        `;

        return;
    }


    result.forEach(book=>{

        const card =
            document.createElement("div");

        card.className = "book";

        card.innerHTML = `

            <h3>${book.name}</h3>

            <p>
                <b>Book ID:</b>
                ${book.id}
            </p>

            <p>
                <b>Department:</b>
                ${book.department}
            </p>

            <div
                class="qr"
                id="qr-${book.id}">
            </div>

            <a
                href="${book.link}"
                target="_blank"
                class="open-btn">

                📖 Open Book

            </a>

        `;

        grid.appendChild(card);


        /* QR CODE */

        new QRCode(

            document.getElementById(
                "qr-"+book.id
            ),

            {
                text:
                    window.location.href
                    .split("?")[0]
                    +
                    "?book="
                    +
                    encodeURIComponent(
                        book.id
                    ),

                width:130,
                height:130
            }

        );

    });

}


/* =====================================
   FILTER
===================================== */

function filterBooks(department){

    selectedDepartment =
        department;

    displayBooks();

}


/* =====================================
   SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    displayBooks
);


/* =====================================
   QR SCAN
===================================== */

function checkQRBook(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const bookID =
        params.get("book");

    if(!bookID){
        return;
    }


    const book =
        books.find(
            item => item.id === bookID
        );


    if(!book){
        return;
    }


    if(book.link !== "#"){

        window.location.href =
            book.link;

    }
    else{

        alert(
            "📚 BOOK FOUND\n\n" +
            "Book ID: " +
            book.id +
            "\nBook: " +
            book.name +
            "\nDepartment: " +
            book.department +
            "\n\nPDF Link is not added yet."
        );

    }

}


/* =====================================
