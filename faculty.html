<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View department HODs, professors, and library administration officers.">
    <title>Faculty Directory | Library Portal</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- AOS Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner-custom"></div>
        <div class="logo-loading">DEPT LIBRARY</div>
        <p class="text-muted mt-2 fs-14">Opening faculty directory...</p>
    </div>

    <!-- Global Header -->
    <header></header>

    <!-- Main Container -->
    <main class="container my-5 pt-5 flex-grow-1">
        <!-- Breadcrumbs Placeholder -->
        <div id="breadcrumbs-container"></div>

        <!-- Faculty Section Header -->
        <div class="row text-center mb-5 mt-4" data-aos="fade-up">
            <div class="col">
                <span class="badge bg-primary-light text-primary px-3 py-2 rounded-pill fw-600 mb-3 fs-12 uppercase">Our Instructors</span>
                <h2 class="fw-800">Faculty & Staff Directory</h2>
                <p class="text-muted">Meet the mentors, engineers, and administrative staff managing the departments</p>
                
                <!-- Filter Pills -->
                <div class="d-flex justify-content-center flex-wrap gap-2 mt-4" id="faculty-filters">
                    <button class="btn btn-sm btn-primary-custom filter-btn" data-dept="">All Departments</button>
                    <button class="btn btn-sm btn-outline-custom filter-btn" data-dept="CO">Computer Eng.</button>
                    <button class="btn btn-sm btn-outline-custom filter-btn" data-dept="IF">Information Tech.</button>
                    <button class="btn btn-sm btn-outline-custom filter-btn" data-dept="EE">Electrical Eng.</button>
                    <button class="btn btn-sm btn-outline-custom filter-btn" data-dept="ME">Mechanical Eng.</button>
                    <button class="btn btn-sm btn-outline-custom filter-btn" data-dept="CE">Civil Eng.</button>
                </div>
            </div>
        </div>

        <!-- Faculty Grid -->
        <div class="row g-4 justify-content-center" id="faculty-grid-container">
            <!-- Dynamic faculty cards -->
        </div>
    </main>

    <!-- Global Footer -->
    <footer></footer>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Script Module -->
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { getFaculty } from "./js/db.js";

        let facultyList = [];
        let activeDept = "";

        document.addEventListener("DOMContentLoaded", async () => {
            await loadFacultyData();
            renderFacultyGrid();

            // Bind filters
            document.querySelectorAll("#faculty-filters .filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll("#faculty-filters .filter-btn").forEach(b => {
                        b.className = "btn btn-sm btn-outline-custom filter-btn";
                    });
                    btn.className = "btn btn-sm btn-primary-custom filter-btn";
                    
                    activeDept = btn.dataset.dept;
                    renderFacultyGrid();
                });
            });
        });

        async function loadFacultyData() {
            try {
                facultyList = await getFaculty();
            } catch (e) {
                console.error("Failed to load faculty:", e);
            }
        }

        function renderFacultyGrid() {
            const container = document.getElementById("faculty-grid-container");
            const filtered = activeDept === "" 
                ? facultyList 
                : facultyList.filter(f => f.department === activeDept);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <span class="material-icons" style="font-size: 64px;">people_outline</span>
                        <h4 class="mt-3">No staff members found in this department.</h4>
                    </div>
                `;
                return;
            }

            const deptNames = {
                CO: "Computer Engineering",
                IF: "Information Technology",
                EE: "Electrical Engineering",
                ME: "Mechanical Engineering",
                CE: "Civil Engineering"
            };

            container.innerHTML = filtered.map((fac, idx) => `
                <div class="col-md-6 col-lg-4 col-xl-3" data-aos="fade-up" data-aos-delay="${(idx % 4) * 100}">
                    <div class="glass-card faculty-card h-100 d-flex flex-column">
                        <div class="faculty-img-wrapper">
                            <img src="${fac.photo}" alt="${fac.name}" class="faculty-img">
                            <div class="faculty-socials">
                                <a href="mailto:${fac.email}" title="Email Faculty"><span class="material-icons">email</span></a>
                                <a href="tel:${fac.contact}" title="Call Faculty"><span class="material-icons">phone</span></a>
                            </div>
                        </div>
                        <div class="p-3 text-center d-flex flex-column flex-grow-1">
                            <span class="badge bg-primary-light text-primary px-3 py-1 rounded-pill fs-11 align-self-center mb-2">${deptNames[fac.department] || fac.department}</span>
                            <h5 class="fw-800 text-color mb-1 fs-16">${fac.name}</h5>
                            <p class="text-primary fw-600 fs-12 mb-2 lh-1">${fac.designation}</p>
                            <p class="text-muted fs-11 mt-auto border-top pt-2 mb-0">${fac.qualification}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
