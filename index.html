<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KDP LIBRARY CHATBOT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f1f5f9;
    color:#172033;
    min-height:100vh;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:16px;
}

/* MAIN */

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

/* SEARCH */

.search{
    width:100%;
    padding:15px 18px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font-size:16px;
    outline:none;
    margin-bottom:25px;
}

.search:focus{
    border-color:#2563eb;
}

/* SECTIONS */

.sections{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.section{
    background:white;
    min-height:220px;
    padding:25px 15px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    border:3px solid transparent;
    transition:.2s;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

.section:hover{
    transform:translateY(-5px);
    border-color:#2563eb;
}

.section:active{
    transform:scale(.96);
}

.icon{
    font-size:60px;
    margin-bottom:15px;
}

.section h2{
    font-size:23px;
    line-height:1.2;
}

.section p{
    margin-top:10px;
    font-size:18px;
    color:#64748b;
}

/* BOOK AREA */

#bookArea{
    display:none;
}

.backBtn{
    background:#475569;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;
    margin-bottom:20px;
}

.backBtn:active{
    transform:scale(.96);
}

.bookTitle{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.bookTitle h2{
    font-size:25px;
}

/* BOOK GRID */

.books{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
    gap:18px;
}

/* BOOK CARD */

.book{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    transition:.2s;
}

.book:hover{
    transform:translateY(-4px);
}

.book:active{
    transform:scale(.98);
}

.bookIcon{
    font-size:42px;
    margin-bottom:10px;
}

.book h3{
    font-size:18px;
    margin-bottom:12px;
    line-height:1.3;
}

.book p{
    color:#64748b;
    margin:7px 0;
    font-size:14px;
}

/* BUTTON ROW */

.btnRow{
    display:flex;
    gap:8px;
    margin-top:10px;
}

/* OPEN BUTTON */

.openBookButton{
    flex:1;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.openBookButton:hover{
    background:#1d4ed8;
}

.openBookButton:active{
    transform:scale(.97);
}

.readBookButton{
    flex:1;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#16a34a;
    color:white;
    font-size:15px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.readBookButton:hover{
    background:#15803d;
}

.readBookButton:active{
    transform:scale(.97);
}

/* MODAL */

#bookModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:99999;
}

.modalBox{
    background:white;
    width:100%;
    max-width:500px;
    padding:28px;
    border-radius:18px;
    text-align:center;
}

.modalIcon{
    font-size:60px;
}

.modalBox h2{
    margin:12px 0;
    color:#2563eb;
}

.modalBox p{
    margin:10px 0;
    color:#475569;
}

.closeButton{
    margin-top:15px;
    padding:12px 30px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* READER (full text view) */

#readerOverlay{
    position:fixed;
    inset:0;
    background:#f1f5f9;
    z-index:999999;
    display:none;
    overflow-y:auto;
}

.readerTop{
    position:sticky;
    top:0;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:18px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2;
}

.readerCloseBtn{
    background:rgba(255,255,255,.15);
    border:none;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    flex-shrink:0;
}

.readerCloseBtn:active{
    transform:scale(.95);
}

.readerTop h2{
    font-size:18px;
    line-height:1.3;
}

.readerBody{
    max-width:800px;
    margin:0 auto;
    padding:25px 20px 60px;
}

.readerMeta{
    background:white;
    border-radius:12px;
    padding:15px 18px;
    margin-bottom:20px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    font-size:14px;
    color:#475569;
}

.chapter{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.chapter h3{
    color:#2563eb;
    font-size:19px;
    margin-bottom:10px;
}

.chapter p{
    font-size:15px;
    line-height:1.7;
    color:#334155;
    margin-bottom:10px;
}

/* NO BOOK */

.noBook{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:15px;
    grid-column:1/-1;
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:25px 15px;
    font-size:17px;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    header p{
        font-size:14px;
    }

    .sections{
        grid-template-columns:1fr 1fr;
        gap:15px;
    }

    .section{
        min-height:190px;
        padding:15px 8px;
    }

    .icon{
        font-size:45px;
    }

    .section h2{
        font-size:18px;
    }

    .section p{
        font-size:15px;
    }

    .books{
        grid-template-columns:1fr;
    }

    .btnRow{
        flex-direction:column;
    }

}

</style>

</head>

/* =================================================
   CREATE 100 BOOKS FOR EVERY DEPARTMENT
================================================= */

let allBooks = [];


const prefixes = {

"Computer Engineering":"CE",

"Electrical Engineering":"EE",

"Mechanical Engineering":"ME",

"Civil Engineering":"CV",

"EC Engineering":"EC"

};


/* =================================================
   GENERATE EXACTLY 100 BOOKS
================================================= */

Object.keys(departmentSubjects).forEach(function(department){

    const subjects = departmentSubjects[department];

    const prefix = prefixes[department];


    for(let i = 0; i < 100; i++){

        const subject =
            subjects[i % subjects.length];


        let bookTitle = subject;


        /*
        If subject repeats after 50,
        add Advanced / Reference / Practice
        */

        if(i >= subjects.length){

            const version =
                Math.floor(i / subjects.length);

            if(version === 1){

                bookTitle =
                    "Advanced " + subject;

            }else if(version === 2){

                bookTitle =
                    subject + " Reference";

            }else{

                bookTitle =
                    subject + " Volume " +
                    (version + 1);

            }

        }


        allBooks.push({

            id:
                prefix +
                String(i + 1).padStart(3,"0"),

            title:bookTitle,

            subject:subject,

            department:department,

            author:"KDP Engineering Library",

            status:"Available"

        });

    }

});


/* =================================================
   AUTO-GENERATED READABLE CONTENT
   (No copyrighted text — original template
   content built per subject, so every one of
   the 500 books has real pages to read.)
================================================= */

const chapterFrames = [

    {
        label:"Introduction",
        text:function(s){
            return "This opening chapter lays the foundation of " + s +
            ". It explains why the topic matters in real engineering " +
            "practice, introduces the key terminology a student will meet " +
            "throughout the book, and outlines how the subject connects to " +
            "the rest of the curriculum.";
        }
    },
    {
        label:"Core Concepts",
        text:function(s){
            return "Here the fundamental principles of " + s + " are broken " +
            "down step by step. Diagrams, worked examples, and simple " +
            "derivations are used to build intuition before moving on to " +
            "more advanced material later in the book.";
        }
    },
    {
        label:"Practical Applications",
        text:function(s){
            return "This chapter shows how " + s + " is applied in real " +
            "industry and laboratory settings. Case studies illustrate " +
            "common problems, the tools engineers use to solve them, and " +
            "the standards typically followed in practice.";
        }
    },
    {
        label:"Problem Solving",
        text:function(s){
            return "A collection of solved and practice problems on " + s +
            " designed to reinforce the concepts covered earlier. Each " +
            "problem includes a short explanation of the reasoning used to " +
            "reach the solution.";
        }
    },
    {
        label:"Summary and Review",
        text:function(s){
            return "The final chapter reviews the key takeaways from " + s +
            ", highlights the most commonly asked exam questions, and " +
            "points toward advanced topics for students who want to go " +
            "further.";
        }
    }

];


function generateChapters(book){

    return chapterFrames.map(function(frame,index){

        return {

            title:
                "Chapter " + (index + 1) +
                ": " + frame.label,

            paragraph:
                frame.text(book.subject)

        };

    });

}


/* =================================================
   DOM ELEMENTS
================================================= */

const sections =
    document.getElementById("sections");

const bookArea =
    document.getElementById("bookArea");

const booksContainer =
    document.getElementById("books");

const departmentTitle =
    document.getElementById("departmentTitle");

const bookCount =
    document.getElementById("bookCount");

const search =
    document.getElementById("search");

const backButton =
    document.getElementById("backButton");

const readerOverlay =
    document.getElementById("readerOverlay");

const readerTitle =
    document.getElementById("readerTitle");

const readerBody =
    document.getElementById("readerBody");

const readerCloseBtn =
    document.getElementById("readerCloseBtn");


let currentDepartment = null;


/* =================================================
   OPEN DEPARTMENT
================================================= */

function openDepartment(department){

    currentDepartment = department;


    sections.style.display = "none";

    bookArea.style.display = "block";


    departmentTitle.innerHTML =
        "📚 " + department;


    bookCount.innerHTML =
        "100 Books Available";


    search.value = "";


    showBooks(department);

}


/* =================================================
   SHOW BOOKS
================================================= */

function showBooks(department,keyword=""){

    booksContainer.innerHTML = "";


    let departmentBooks =
        allBooks.filter(function(book){

            return book.department === department;

        });


    if(keyword.trim() !== ""){

        const text =
            keyword.toLowerCase().trim();


        departmentBooks =
            departmentBooks.filter(function(book){

                return (

                    book.title
                    .toLowerCase()
                    .includes(text)

                    ||

                    book.id
                    .toLowerCase()
                    .includes(text)

                );

            });

    }


    if(departmentBooks.length === 0){

        booksContainer.innerHTML = `

        <div class="noBook">

            <h2>❌ Book Not Found</h2>

            <p>
                Please try another search.
            </p>

        </div>

        `;

        return;

    }


    departmentBooks.forEach(function(book){

        const card =
            document.createElement("div");


        card.className = "book";


        card.innerHTML = `

        <div class="bookIcon">
            📘
        </div>

        <h3>
            ${book.title}
        </h3>

        <p>
            <b>Book ID:</b>
            ${book.id}
        </p>

        <p>
            <b>Department:</b>
            ${book.department}
        </p>

        <p>
            🟢 <b>${book.status}</b>
        </p>

        <div class="btnRow">

            <button
                type="button"
                class="readBookButton">

                📖 Read Book

            </button>

            <button
                type="button"
                class="openBookButton">

                ℹ️ Details

            </button>

        </div>

        `;


        const readButton =
            card.querySelector(
                ".readBookButton"
            );

        const infoButton =
            card.querySelector(
                ".openBookButton"
            );


        /* READ BOOK — CLICK + TOUCH */

        readButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                readBook(book.id);

            }
        );

        readButton.addEventListener(
            "touchend",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                readBook(book.id);

            },
            {passive:false}
        );


        /* DETAILS — CLICK + TOUCH */

        infoButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                openBook(book.id);

            }
        );

        infoButton.addEventListener(
            "touchend",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                openBook(book.id);

            },
            {passive:false}
        );


        booksContainer.appendChild(card);

    });

}


/* =================================================
   OPEN BOOK (details modal)
================================================= */

function openBook(bookID){

    const book =
        allBooks.find(function(item){

            return item.id === bookID;

        });


    if(!book){

        alert("Book not found!");

        return;

    }


    const oldModal =
        document.getElementById("bookModal");


    if(oldModal){

        oldModal.remove();

    }


    const modal =
        document.createElement("div");


    modal.id = "bookModal";


    modal.innerHTML = `

    <div class="modalBox">

        <div class="modalIcon">
            📖
        </div>

        <h2>
            ${book.title}
        </h2>

        <p>
            <b>Book ID:</b>
            ${book.id}
        </p>

        <p>
            <b>Department:</b>
            ${book.department}
        </p>

        <p>
            <b>Author:</b>
            ${book.author}
        </p>

        <p>
            🟢 <b>Status:</b>
            ${book.status}
        </p>

        <button
            class="closeButton"
            type="button"
            id="closeBookButton">

            ✕ Close

        </button>

    </div>

    `;


    document.body.appendChild(modal);


    document
    .getElementById("closeBookButton")
    .addEventListener(
        "click",
        closeBook
    );


    document
    .getElementById("closeBookButton")
    .addEventListener(
        "touchend",
        function(event){

            event.preventDefault();

            closeBook();

        },
        {passive:false}
    );

}


/* =================================================
   CLOSE BOOK
================================================= */

function closeBook(){

    const modal =
        document.getElementById("bookModal");


    if(modal){

        modal.remove();

    }

}


/* =================================================
   READ BOOK (full readable content)
================================================= */

function readBook(bookID){

    const book =
        allBooks.find(function(item){

            return item.id === bookID;

        });


    if(!book){

        alert("Book not found!");

        return;

    }


    readerTitle.innerHTML =
        "📖 " + book.title;


    const chapters =
        generateChapters(book);


    let html = `

    <div class="readerMeta">

        <b>Book ID:</b> ${book.id}
        &nbsp;|&nbsp;
        <b>Department:</b> ${book.department}
        &nbsp;|&nbsp;
        <b>Author:</b> ${book.author}

    </div>

    `;


    chapters.forEach(function(chapter){

        html += `

        <div class="chapter">

            <h3>${chapter.title}</h3>

            <p>${chapter.paragraph}</p>

        </div>

        `;

    });


    readerBody.innerHTML = html;


    readerOverlay.style.display = "block";

    window.scrollTo(0,0);

}


/* =================================================
   CLOSE READER
================================================= */

function closeReader(){

    readerOverlay.style.display = "none";

}


readerCloseBtn.addEventListener(
    "click",
    closeReader
);

readerCloseBtn.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        closeReader();

    },
    {passive:false}
);


/* =================================================
   BACK TO SECTIONS
================================================= */

function goBack(){

    bookArea.style.display = "none";

    sections.style.display = "grid";

    currentDepartment = null;

    search.value = "";

}


/* =================================================
   BACK BUTTON
================================================= */

backButton.addEventListener(
    "click",
    function(){

        goBack();

    }
);


/* =================================================
   SEARCH
================================================= */

search.addEventListener(
    "input",
    function(){

        if(!currentDepartment){

            return;

        }


        showBooks(
            currentDepartment,
            search.value
        );

    }
);


/* =================================================
   SECTION CLICK + MOBILE TOUCH
================================================= */

document
.querySelectorAll(".section")
.forEach(function(section){


    const department =
        section.dataset.department;


    /* NORMAL CLICK */

    section.addEventListener(
        "click",
        function(){

            openDepartment(
                department
            );

        }
    );


    /* MOBILE TOUCH */

    section.addEventListener(
        "touchend",
        function(event){

            event.preventDefault();

            openDepartment(
                department
            );

        },
        {passive:false}
    );


});


/* =================================================
   PREVENT DOUBLE TOUCH
================================================= */

let lastTouch = 0;

document.addEventListener(
    "touchend",
    function(){

        const now =
            Date.now();


        if(now - lastTouch < 300){

            return;

        }


        lastTouch = now;

    },
    {passive:true}
);

</script>

</body>
