function $(selector) {
  return document.querySelector(selector);
}

function $$(selector) {
  return [...document.querySelectorAll(selector)];
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function generateId(prefix = "ID") {
  return (
    prefix +
    Date.now().toString(36) +
    Math.random().toString(36).substring(2, 7)
  ).toUpperCase();
}

function today() {
  return new Date().toISOString().split("T")[0];
}

function formatDate(date) {
  if (!date) return "-";

  return new Date(date).toLocaleDateString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function getToken() {
  return localStorage.getItem(CONFIG.STORAGE.TOKEN);
}

function setToken(token) {
  if (token) {
    localStorage.setItem(CONFIG.STORAGE.TOKEN, token);
  } else {
    localStorage.removeItem(CONFIG.STORAGE.TOKEN);
  }
}

const DB = {

  get(key, fallback = []) {
    try {

      if (!value) return fallback;

      return JSON.parse(value);

    } catch (error) {
      console.error("Storage read error:", error);
      return fallback;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;

    } catch (error) {
      console.error("Storage write error:", error);
      showToast("Storage error", "danger");
      return false;
    }
  },

  remove(key) {
    localStorage.removeItem(key);
  }
};

/* ============================================================
   12. SEARCH ENGINE
   ============================================================ */

function getFilteredBooks() {

  let books =
    [...allBooks];


  if (currentSearch.trim()) {

    const query =
      currentSearch
        .toLowerCase()
        .trim();


    books =
      books.filter(book =>

        [
          book.id,
          book.title,
          book.author,
          book.department,
          book.subject,
          book.year,
          book.semester,
          book.isbn
        ]
        .join(" ")
        .toLowerCase()
        .includes(query)

      );

  }


  if (
    currentDepartment !== "all"
  ) {

    books =
      books.filter(
        book =>
          book.department ===
          currentDepartment
      );

  }


  if (
    currentAvailability !== "all"
  ) {

    const available =
      currentAvailability === "available";


    books =
      books.filter(
        book =>
          book.available ===
          available
      );

  }


  books.sort(
    (a, b) => {

      if (currentSort === "title") {

        return a.title.localeCompare(
          b.title
        );

      }

      if (currentSort === "author") {

        return a.author.localeCompare(
          b.author
        );

      }

      if (currentSort === "year") {

        return (
          Number(b.year) -
          Number(a.year)
        );

      }

      if (currentSort === "availability") {

        return (
          Number(b.available) -
          Number(a.available)
        );

      }

      return 0;

    }
  );


  return books;
}

/* ============================================================
   14. PAGINATION
   ============================================================ */

function renderPagination(total) {

  let container =
    $("#searchPagination");


  if (!container) {

    container =
      document.createElement("div");

    container.id =
      "searchPagination";

    container.style.cssText = `
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      margin-top:20px;
      flex-wrap:wrap;
    `;


    const grid =
      $("#grid-search");

    if (grid)
      grid.parentNode
        .appendChild(container);

  }


  const pages =
    Math.ceil(
      total /
      CONFIG.PAGE_SIZE
    );


  if (pages <= 1) {

    container.innerHTML = "";

    return;
  }


  let html = "";


  for (
    let page = 1;
    page <= pages;
    page++
  ) {

    html += `

      <button
        class="page-btn"
        data-page="${page}"
        style="
          padding:7px 11px;
          border:1px solid var(--line);
          background:${
            page === currentPage
              ? "var(--accent)"
              : "var(--paper-card)"
          };
          color:${
            page === currentPage
              ? "#231a06"
              : "var(--ink)"
          };
          border-radius:6px;
          cursor:pointer;
        "
      >
        ${page}
      </button>

    `;

  }


  container.innerHTML = html;

}


/* ============================================================
   15. NAVIGATION
   ============================================================ */

function navigate(sectionId) {

  const section =
    document.getElementById(
      sectionId
    );

  if (!section) return;


  $$(".section")
    .forEach(section =>
      section.classList.remove(
        "active"
      )
    );


  section.classList.add(
    "active"
  );


  $$(".nav-item")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.section ===
        sectionId
      );

    });


  const activeButton =
    $(
      `.nav-item[data-section="${sectionId}"]`
    );


  if (activeButton) {

    $("#pageTitle").textContent =
      activeButton.textContent
        .trim()
        .replace(/^[^\w]+/, "");

  }


  if (
    window.innerWidth <= 820
  ) {

    $("#sidebar")
      ?.classList.remove("open");

  }


  if (sectionId === "search") {

    renderSearchResults();

  }


  if (sectionId === "faculty") {

    renderFaculty();

  }


  if (sectionId === "admin") {

    renderAdminBooks();

  }


  if (sectionId === "reports") {

    updateDashboardStats();

    renderReportsTable();

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}
