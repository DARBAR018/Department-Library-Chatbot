<section id="computerBooks">

    background: #f5f7fb;
}

#computerBooks h2 {
    text-align: center;
    color: #172554;
    margin-bottom: 20px;
}

#bookSearch {
    display: block;
    width: 90%;
    max-width: 600px;
    margin: 0 auto 25px;
    padding: 13px;
    border: 2px solid #2563eb;
    border-radius: 10px;
    font-size: 16px;
}

#bookContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
}

.book-card {
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    text-align: center;
    transition: 0.3s;
}

.book-card:hover {
    transform: translateY(-5px);
}

.book-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.book-card h3 {
    font-size: 18px;
    color: #111827;
    min-height: 48px;
}

.book-card p {
    color: #555;
    font-size: 14px;
}

.qr-code {
    width: 130px;
    height: 130px;
    margin: 12px auto;
    display: block;
}

.read-btn {
    display: inline-block;
    padding: 10px 18px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.read-btn:hover {
    background: #1d4ed8;
}
</style>

function displayBooks(books) {

    const container = document.getElementById("bookContainer");

    container.innerHTML = "";

    books.forEach((book, index) => {

        const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="
        + encodeURIComponent(book.url);

        container.innerHTML += `

        <div class="book-card">

            <div class="book-icon">📚</div>

            <h3>${index + 1}. ${book.title}</h3>

            <p>👨‍💻 Author: ${book.author}</p>

            <p>📖 Computer Engineering</p>

            <img class="qr-code"
                 src="${qrURL}"
                 alt="QR Code">

            <p>📱 Scan QR Code to Open Book</p>

            <a class="read-btn"
               href="${book.url}"
               target="_blank">
               📖 Open / Read
            </a>

        </div>

        `;

    });
}

function searchBooks() {

    const search =
        document.getElementById("bookSearch")
        .value.toLowerCase();

    const filtered =
        computerBooks.filter(book =>
            book.title.toLowerCase().includes(search) ||
            book.author.toLowerCase().includes(search)
        );

    displayBooks(filtered);
}

displayBooks(computerBooks);
