<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fine Management - Department Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 25px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            font-size: 22px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .warning {
            background: #f59e0b;
            color: white;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 26px;
            font-weight: bold;
        }

        .table-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }

        input {
            min-width: 230px;
            flex: 1;
        }

        select {
            min-width: 160px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .paid {
            background: #dcfce7;
            color: #166534;
        }

        .unpaid {
            background: #fee2e2;
            color: #991b1b;
        }

        .partial {
            background: #fef3c7;
            color: #92400e;
        }

        .actions button {
            padding: 7px 10px;
            margin-right: 4px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 20px;
            }

            .container {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Department Library</h1>
    <p>Fine Management System</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Fine Management</h2>

        <button class="primary" onclick="showAddFine()">
            + Add Fine
        </button>
    </div>

    <!-- Statistics -->
    <div class="cards">

        <div class="card">
            <h3>Total Fine</h3>
            <div class="number" id="totalFine">₹0</div>
        </div>

        <div class="card">
            <h3>Paid Fine</h3>
            <div class="number" id="paidFine">₹0</div>
        </div>

        <div class="card">
            <h3>Pending Fine</h3>
            <div class="number" id="pendingFine">₹0</div>
        </div>

        <div class="card">
            <h3>Total Records</h3>
            <div class="number" id="totalRecords">0</div>
        </div>

    </div>

    <div class="table-box">

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student, book or ID..."
                onkeyup="filterFines()"
            >

            <select id="statusFilter" onchange="filterFines()">
                <option value="all">All Status</option>
                <option value="paid">Paid</option>
                <option value="unpaid">Unpaid</option>
                <option value="partial">Partial</option>
            </select>

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Book</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Days Late</th>
                    <th>Fine</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="fineTableBody"></tbody>

        </table>

    </div>

</div>

<footer>
    Department Library &copy; 2026
</footer>

<script>

    let fines = [
        {
            id: 1,
            student: "Student 1",
            book: "Database Management System",
            issueDate: "2026-08-01",
            dueDate: "2026-08-07",
            daysLate: 5,
            fine: 25,
            status: "unpaid"
        },
        {
            id: 2,
            student: "Student 2",
            book: "Web Development",
            issueDate: "2026-07-20",
            dueDate: "2026-07-27",
            daysLate: 3,
            fine: 15,
            status: "paid"
        },
        {
            id: 3,
            student: "Student 3",
            book: "Computer Networks",
            issueDate: "2026-07-25",
            dueDate: "2026-08-01",
            daysLate: 2,
            fine: 10,
            status: "partial"
        }
    ];

    function displayFines(data = fines) {

        const tbody = document.getElementById("fineTableBody");

        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML =
                '<tr><td colspan="9" class="empty">No fine records found.</td></tr>';
            updateStats();
            return;
        }

        data.forEach(fine => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${fine.id}</td>
                <td>${fine.student}</td>
                <td>${fine.book}</td>
                <td>${fine.issueDate}</td>
                <td>${fine.dueDate}</td>
                <td>${fine.daysLate}</td>
                <td>₹${fine.fine}</td>

                <td>
                    <span class="status ${fine.status}">
                        ${capitalize(fine.status)}
                    </span>
                </td>

                <td class="actions">

                    ${
                        fine.status !== "paid"
                        ?
                        `<button class="success"
                            onclick="markPaid(${fine.id})">
                            Pay
                        </button>`
                        :
                        ""
                    }

                    <button class="danger"
                        onclick="deleteFine(${fine.id})">
                        Delete
                    </button>

                </td>
            `;

            tbody.appendChild(row);
        });

        updateStats();
    }

    function capitalize(text) {
        return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function updateStats() {

        const total = fines.reduce(
            (sum, fine) => sum + Number(fine.fine),
            0
        );

        const paid = fines
            .filter(fine => fine.status === "paid")
            .reduce((sum, fine) => sum + Number(fine.fine), 0);

        const pending = fines
            .filter(fine => fine.status !== "paid")
            .reduce((sum, fine) => sum + Number(fine.fine), 0);

        document.getElementById("totalFine").textContent =
            "₹" + total;

        document.getElementById("paidFine").textContent =
            "₹" + paid;

        document.getElementById("pendingFine").textContent =
            "₹" + pending;

        document.getElementById("totalRecords").textContent =
            fines.length;
    }

    function filterFines() {

        const search =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const status =
            document.getElementById("statusFilter").value;

        const filtered = fines.filter(fine => {

            const matchesSearch =
                fine.student.toLowerCase().includes(search) ||
                fine.book.toLowerCase().includes(search) ||
                String(fine.id).includes(search);

            const matchesStatus =
                status === "all" ||
                fine.status === status;

            return matchesSearch && matchesStatus;
        });

        displayFines(filtered);
    }

    function markPaid(id) {

        const fine = fines.find(f => f.id === id);

        if (!fine) return;

        fine.status = "paid";

        displayFines();
    }

    function deleteFine(id) {

        if (!confirm("Are you sure you want to delete this fine record?")) {
            return;
        }

        fines = fines.filter(fine => fine.id !== id);

        displayFines();
    }

    function showAddFine() {

        const student =
            prompt("Enter student name:");

        if (!student) return;

        const book =
            prompt("Enter book name:");

        if (!book) return;

        const amount =
            Number(prompt("Enter fine amount:"));

        if (!amount || amount <= 0) {
            alert("Please enter a valid fine amount.");
            return;
        }

        const newFine = {

            id: fines.length
                ? Math.max(...fines.map(f => f.id)) + 1
                : 1,

            student: student,

            book: book,

            issueDate: new Date()
                .toISOString()
                .split("T")[0],

            dueDate: new Date()
                .toISOString()
                .split("T")[0],

            daysLate: 1,

            fine: amount,

            status: "unpaid"
        };

        fines.push(newFine);

        displayFines();
    }

    displayFines();

</script>

</body>
  </html>
