<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and download curriculum textbooks and digital references.">
    <title>Digital E-Books | Library Portal</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- AOS Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        .ebook-reader-page {
            background: #ffffff;
            color: #1e293b;
            padding: 35px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
            font-family: Georgia, serif;
            min-height: 480px;
        }
        .reader-chapter-title {
            font-weight: bold;
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 8px;
        }
        .reader-para {
            text-align: justify;
            text-indent: 30px;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 15px;
        }
        [data-theme="dark"] .ebook-reader-page {
            background: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner-custom"></div>
        <div class="logo-loading">DEPT LIBRARY</div>
        <p class="text-muted mt-2 fs-14">Opening digital reference shelves...</p>
    </div>

    <!-- Global Header -->
    <header></header>

    <!-- Main Container -->
    <main class="container my-5 pt-5 flex-grow-1">
        <!-- Breadcrumbs Placeholder -->
        <div id="breadcrumbs-container"></div>

        <div class="row g-4 mt-3">
            <!-- Sidebar controls -->
            <div class="col-lg-3" data-aos="fade-right">
                <div class="glass-card p-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-800 text-primary mb-3 d-flex align-items-center gap-2">
                        <span class="material-icons">auto_stories</span> Categories
                    </h5>
                    
                    <!-- Search Input -->
                    <div class="mb-3">
                        <label class="form-label fw-600 fs-13">Search E-Books</label>
                        <input type="text" id="ebook-search-bar" class="form-control form-control-custom" placeholder="Title, author, keywords...">
                    </div>

                    <!-- Category List -->
                    <div class="list-group list-group-flush gap-1" id="category-pills-list">
                        <button class="list-group-item list-group-item-action border-0 rounded py-2 active-category-pill" data-category="">All Categories</button>
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </div>

            <!-- Ebooks Catalog Grid -->
            <div class="col-lg-9" data-aos="fade-left">
                <div class="row g-4" id="ebooks-grid-container">
                    <!-- Dynamic cards -->
                </div>
            </div>
        </div>
    </main>

    <!-- E-BOOK PREVIEW / READER MODAL -->
    <div class="modal fade pdf-modal" id="ebookReaderModal" tabindex="-1" aria-labelledby="ebookReaderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-800" id="ebookReaderModalLabel">E-Book Virtual Reader</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: var(--text-color) invert(1);"></button>
                </div>
                <div class="modal-body bg-light overflow-y-auto" style="max-height: 550px;">
                    <div class="ebook-reader-page" id="ebook-reader-page-content">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <span class="fs-12 text-muted" id="reader-page-number">Virtual Preview Mode</span>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Close Reader</button>
                        <button type="button" class="btn btn-primary-custom" id="ebook-download-btn"><span class="material-icons fs-16 align-middle">download</span> Download PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Footer -->
    <footer></footer>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Script Module -->
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { getEbooks } from "./js/db.js";

        let allEbooks = [];
        let activeCategory = "";
        let selectedEbook = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadEbooksData();
            buildCategoryList();
            filterAndRenderEbooks();

            // Bind events
            document.getElementById("ebook-search-bar").addEventListener("input", filterAndRenderEbooks);
            document.getElementById("ebook-download-btn").addEventListener("click", () => {
                if (selectedEbook) triggerEbookDownload(selectedEbook);
            });
        });

        async function loadEbooksData() {
            try {
                allEbooks = await getEbooks();
            } catch (e) {
                console.error("Failed to load ebooks:", e);
            }
        }

        function buildCategoryList() {
            const container = document.getElementById("category-pills-list");
            const categories = [...new Set(allEbooks.map(e => e.category))];
            
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = "list-group-item list-group-item-action border-0 rounded py-2";
                btn.textContent = cat;
                btn.dataset.category = cat;
                btn.style.background = "transparent";
                btn.style.color = "var(--text-color)";
                container.appendChild(btn);
            });

            // Add active styles on click
            const buttons = container.querySelectorAll("button");
            buttons.forEach(btn => {
                btn.addEventListener("click", () => {
                    buttons.forEach(b => {
                        b.classList.remove("active");
                        b.style.background = "transparent";
                        b.style.color = "var(--text-color)";
                    });
                    btn.classList.add("active");
                    btn.style.background = "var(--primary-color)";
                    btn.style.color = "white";
                    
                    activeCategory = btn.dataset.category;
                    filterAndRenderEbooks();
                });
            });
            
            // Set initial state
            buttons[0].classList.add("active");
            buttons[0].style.background = "var(--primary-color)";
            buttons[0].style.color = "white";
        }

        function filterAndRenderEbooks() {
            const query = document.getElementById("ebook-search-bar").value.toLowerCase();
            
            const filtered = allEbooks.filter(e => {
                const matchCategory = activeCategory === "" || e.category === activeCategory;
                const matchQuery = e.title.toLowerCase().includes(query) || 
                                   e.author.toLowerCase().includes(query);
                
                return matchCategory && matchQuery;
            });

            renderEbooksGrid(filtered);
        }

        function renderEbooksGrid(ebooks) {
            const container = document.getElementById("ebooks-grid-container");
            if (ebooks.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <span class="material-icons" style="font-size: 64px;">auto_stories</span>
                        <h4 class="mt-3">No E-books found matching filters.</h4>
                    </div>
                `;
                return;
            }

            container.innerHTML = ebooks.map(e => `
                <div class="col-md-6 col-xl-4">
                    <div class="glass-card p-4 h-100 d-flex flex-column">
                        <span class="badge bg-primary-light text-primary px-3 py-1 rounded-pill align-self-start mb-3 fs-11 fw-600">${e.category}</span>
                        <h5 class="fw-800 text-color mb-1 text-truncate-2" style="height: 48px; line-height:1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${e.title}</h5>
                        <p class="text-muted fs-13 mb-3">by ${e.author}</p>
                        
                        <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top fs-12 text-muted">
                            <span>File Size: <strong>${e.size}</strong></span>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm btn-outline-custom read-btn" data-id="${e.id}"><span class="material-icons fs-14 align-middle">visibility</span> Read</button>
                                <button class="btn btn-sm btn-primary-custom download-btn" data-id="${e.id}"><span class="material-icons fs-14 align-middle">download</span> Get</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Attach triggers
            document.querySelectorAll(".read-btn").forEach(btn => {
                btn.addEventListener("click", () => openReaderModal(btn.dataset.id));
            });
            document.querySelectorAll(".download-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const ebook = allEbooks.find(e => e.id === btn.dataset.id);
                    if (ebook) triggerEbookDownload(ebook);
                });
            });
        }

        function openReaderModal(id) {
            const ebook = allEbooks.find(e => e.id === id);
            if (!ebook) return;

            selectedEbook = ebook;
            const content = document.getElementById("ebook-reader-page-content");
            
            // Render virtual book pages
            content.innerHTML = `
                <div class="reader-chapter-title">Chapter 1: Foundations of Technical Study</div>
                <p class="reader-para">Welcome to "${ebook.title}". In engineering education, textbooks serve as a fundamental pillar. This text presents a detailed overview of curricular principles, detailing the methodologies, designs, and analytical steps required to construct and debug technical projects.</p>
                <p class="reader-para">As student users study these chapters, it is highly recommended to complement literature reading with coding routines, laboratory simulations, and physical experiments. The algorithms and architectures covered in subsequent chapters form the baseline of modern computing systems.</p>
                <p class="reader-para">To proceed further, students must be familiar with prerequisites like advanced mathematics, logic gates, and modular planning patterns. Keep this reference handbook active throughout the semester modules.</p>
            `;

            const modal = new bootstrap.Modal(document.getElementById("ebookReaderModal"));
            modal.show();
        }

        function triggerEbookDownload(ebook) {
            window.showToast("Preparing Download", `Assembling ${ebook.fileName}...`, "info");
            
            setTimeout(() => {
                const dummyContent = `%PDF-1.4\n%...\n1 0 obj\n<< /Title (${ebook.title}) >>\nendobj\n...`;
                const blob = new Blob([dummyContent], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = ebook.fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                window.showToast("Download Complete", `${ebook.fileName} downloaded successfully.`, "success");
            }, 1000);
        }
    </script>
</body>
</html>
